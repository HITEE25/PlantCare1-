
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Care Reminders | PlantCare</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="care">
    <main>
        <h1 style="text-align: center;">Care Reminders</h1>

        <div id="over"></div>

        <h3>Upcoming</h3>
        <div id="up"></div>

        <div class="panel">
            <h3>Customize Care Schedule</h3>

            <form id="form" novalidate>
                <label for="plant">Plant</label>
                <select id="plant"></select>

                <label for="type">Task</label>
                <select id="type">
                    <option>Water</option>
                    <option>Fertilize</option>
                    <option>Prune</option>
                    <option>Repot</option>
                </select>

                <label for="due">First due date</label>
                <input type="date" id="due">

                <label for="every">
                    Repeat every (days, 0 = once)
                </label>
                <input
                    type="number"
                    id="every"
                    min="0"
                    value="7"
                >

                <div class="err" id="err"></div>

                <button class="btn" style="margin-top: 10px;">
                    Set Reminder
                </button>
            </form>

            <button
                class="btn soft"
                id="notif"
                style="margin-top: 10px;"
            >
                Enable browser notifications
            </button>
        </div>
    </main>

    <script src="js/plants-data.js"></script>
    <script src="js/auth.js"></script><script>Auth.require()</script>
    <script src="js/app.js"></script>
    <script src="js/pages.js"></script>
</body>
</html>
