<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · PlantCare</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signin">
<main>
  <!-- Shown when nobody is signed in -->
  <section id="formView">
    <div class="art-circle" aria-hidden="true">🪴</div>
    <h1 id="title">Welcome back</h1>
    <p class="sub" id="sub">Sign in to take care of your plants</p>

    <form id="authForm" novalidate>
      <div id="nameWrap" hidden>
        <label for="name">Full name</label>
        <input id="name" type="text" autocomplete="name" placeholder="Your name">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters">
      <div class="err" id="err" role="alert"></div>
      <button class="btn wide" id="submitBtn">Sign in</button>
    </form>

    <p class="switch"><span id="switchText">New here?</span>
      <button class="link" id="switchBtn" type="button">Create account</button></p>
  </section>

  <!-- Shown when already signed in (this is what the Profile tab shows) -->
  <section id="profileView" hidden>
    <div class="art-circle" aria-hidden="true">👤</div>
    <h1 id="who"></h1>
    <p class="sub" id="whoEmail"></p>
    <a class="btn wide" href="index.html">Go to Home</a>
    <button class="btn soft wide" id="signOutBtn">Sign out</button>
  </section>
</main>

<script src="js/plants-data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
