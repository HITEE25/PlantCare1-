
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · PlantCare+</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="signin">
    <main class="signin-main">
        <section id="formView" class="signin-card">

            <div class="brand">
                <img
                    src="images/plantcare-logo.png"
                    alt="PlantCare+ — Smart Indoor Plant Assistance"
                    class="brand-logo"
                >
            </div>

            <h1 id="title">Login</h1>

            <div class="role-buttons">
                <button class="role-btn active" type="button">
                    User
                </button>

                <button class="role-btn" type="button">
                    Admin
                </button>

                <button class="role-btn" type="button">
                    Botanist
                </button>
            </div>

            <form id="authForm" novalidate>
                <div id="nameWrap" hidden>
                    <label for="name">Full Name</label>
                    <input
                        id="name"
                        type="text"
                        autocomplete="name"
                        placeholder="Enter your name"
                    >
                </div>

                <label for="email">Email or Username</label>
                <input
                    id="email"
                    type="text"
                    autocomplete="username"
                    placeholder="Enter email or username"
                >

                <label for="password">Password</label>
                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                >

                <div class="forgot-password">
                    <a href="#" onclick="return false;">Forget password?</a>
                </div>

                <div class="err" id="err" role="alert"></div>

                <button
                    class="btn wide login-btn"
                    id="submitBtn"
                    type="submit"
                >
                    Login
                </button>
            </form>

            <div class="switch">
                <span id="switchText">New here?</span>
                <button
                    class="link"
                    id="switchBtn"
                    type="button"
                >
                    Create account
                </button>
            </div>
        </section>

        <section id="profileView" class="signin-card" hidden>
            <div class="profile-icon" aria-hidden="true">👤</div>

            <h1 id="who"></h1>
            <p class="sub" id="whoEmail"></p>

            <a class="btn wide" href="index.html">Go to Home</a>

            <button
                class="btn soft wide"
                id="signOutBtn"
                type="button"
            >
                Sign out
            </button>
        </section>
    </main>

    <script src="js/plants-data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
