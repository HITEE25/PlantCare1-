
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Plant · PlantCare</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="rec">
    <main>
        <h1>Find Your Plant</h1>
        <p class="subtitle">
            Discover plants that perfectly match your space and lifestyle.
        </p>

        <form class="panel" id="form">

            <h2>Room Details</h2>

            <label for="room">Room type</label>
            <select id="room" name="room">
                <option value="bedroom">Bedroom</option>
                <option value="living">Living Room</option>
                <option value="office">Office</option>
                <option value="balcony">Balcony</option>
                <option value="kitchen">Kitchen</option>
                <option value="other">Other</option>
            </select>

            <label for="light">Light availability</label>
            <select id="light" name="light">
                <option value="low">Low light</option>
                <option value="medium" selected>Medium light</option>
                <option value="bright">Bright indirect light</option>
                <option value="direct">Direct sunlight</option>
            </select>

            <label for="windows">Number of windows</label>
            <select id="windows" name="windows">
                <option value="0">No windows</option>
                <option value="1">1 window</option>
                <option value="2">2 windows</option>
                <option value="3">3 or more windows</option>
            </select>

            <label for="direction">Window direction</label>
            <select id="direction" name="direction">
                <option value="unknown">Not sure</option>
                <option value="north">North</option>
                <option value="south">South</option>
                <option value="east">East</option>
                <option value="west">West</option>
            </select>

            <label for="size">Room size</label>
            <select id="size" name="size">
                <option value="s">Small</option>
                <option value="m" selected>Medium</option>
                <option value="l">Large</option>
            </select>

            <label for="pets">Pet friendly?</label>
            <select id="pets" name="pets">
                <option value="no">No pets at home</option>
                <option value="yes">Yes, I have pets</option>
            </select>

            <h2>Plant Care Preferences</h2>

            <label for="care">Watering preference</label>
            <select id="care" name="care">
                <option value="low">Low maintenance</option>
                <option value="moderate" selected>Moderate</option>
                <option value="high">Frequent watering</option>
            </select>

            <label for="exp">Your gardening experience</label>
            <select id="exp" name="exp">
                <option value="Easy" selected>Beginner</option>
                <option value="Moderate">Intermediate</option>
                <option value="Hard">Expert</option>
            </select>

            <label for="purpose">Purpose of the plant</label>
            <select id="purpose" name="purpose">
                <option value="decoration">Home decoration</option>
                <option value="air">Air quality</option>
                <option value="desk">Desk plant</option>
                <option value="all">All purposes</option>
            </select>

            <button type="submit" class="btn wide">
                Find My Plants
            </button>

        </form>

        <section id="out" class="recommendation-results">
            <!-- Recommended plants will appear here -->
        </section>

    </main>

    <script src="js/plants-data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        Auth.require();
    </script>
    <script src="js/app.js"></script>
    <script src="js/pages.js"></script>
</body>
</html>
