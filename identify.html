
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Identify · PlantCare</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="identify">
    <main>
        <h1>Identify a Plant</h1>


        <div class="drop" id="drop" tabindex="0">
            <p>📷 Drag &amp; drop a photo here, or click to choose</p>

            <input
                id="file"
                type="file"
                accept="image/*"
                hidden
            >

            <img
                id="preview"
                alt="Your uploaded plant photo"
                hidden
            >
        </div>

        <div class="err" id="err"></div>

        <button class="btn wide" id="go">
            Identify Plant
        </button>
        <div id="result"></div>
    </main>
  
    <script src="js/plants-data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        Auth.require();
    </script>
    <script src="js/app.js"></script>
    <script src="js/pages.js"></script>
</body>
</html>
